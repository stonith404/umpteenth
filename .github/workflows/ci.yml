name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run of the previous one, while every run on main finishes
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only and Markdown-only changes skip the backend, sandbox and E2E jobs
  # Skipped jobs count as passed, so they can still be required checks
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            app:
              - "**"
              - "!docs/**"
              - "!**/*.md"

  backend:
    name: Backend (${{ matrix.db }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Generated code is up to date
        if: matrix.db == 'sqlite'
        run: ./scripts/sqlc.sh && git diff --exit-code
      - name: Go modules are tidy
        if: matrix.db == 'sqlite'
        run: go mod tidy -diff
      - name: Vet
        run: go vet -tags exclude_frontend,exclude_ump,unit ./...
      - name: Unit tests
        env:
          TEST_DB: ${{ matrix.db }}
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -tags exclude_frontend,exclude_ump,unit -race ./...

  lint:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          working-directory: backend
          args: --build-tags exclude_frontend,exclude_ump,unit
          only-new-issues: ${{ github.event_name == 'pull_request' }}

  # Every combination of values renders manifests the Kubernetes API accepts
  chart:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: helm lint charts/umpteenth --strict --set app.url=https://umpteenth.example.com
      - name: Validate the manifests
        run: |
          variants=(
            ""
            "--set ingress.enabled=true --set ingress.host=umpteenth.example.com --set sandbox.namespace=umpteenth-sandboxes --set sandbox.createNamespace=true --set sandbox.registry.repository=ghcr.io/acme/jobs --set sandbox.registry.username=bot --set sandbox.registry.password=secret"
            "--set replicaCount=1 --set postgresql.enabled=false --set persistence.enabled=true --set fileStorage.backend=filesystem"
            "-f tests/setup/values-kind.yaml"
          )
          for variant in "${variants[@]}"; do
            read -ra args <<< "$variant"
            helm template umpteenth charts/umpteenth --set app.url=https://umpteenth.example.com "${args[@]}" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary
          done

  sandbox:
    name: Sandbox conformance (${{ matrix.engine }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, gvisor, kubernetes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install gVisor
        if: matrix.engine == 'gvisor'
        run: |
          url="https://storage.googleapis.com/gvisor/releases/release/20260921/$(uname -m)"
          wget -q "$url/gvisor.tar.bz2" "$url/gvisor.tar.bz2.sha512"
          sha512sum -c gvisor.tar.bz2.sha512
          mkdir gvisor && tar -xjf gvisor.tar.bz2 -C gvisor
          sudo cp -r gvisor/runsc gvisor/containerd-shim-runsc-v1 gvisor/gvisor-bin /usr/local/bin/
          sudo /usr/local/bin/runsc install -- --overlay2=none --file-access=shared
          sudo systemctl restart docker
          echo "SANDBOXTEST_RUNTIME=runsc" >> "$GITHUB_ENV"
      - name: Build the sandbox image
        run: docker build -t ghcr.io/stonith404/umpteenth-sandbox:latest docker/sandbox
      # Pods reach the suite's stub broker through the gateway of kind's network, and job images go to a registry on it
      # Init containers copy the ump CLI from an image that holds nothing else, which stands in for the Umpteenth image
      - name: Start a kind cluster
        if: matrix.engine == 'kubernetes'
        run: |
          eval "$(tests/setup/kind.sh)"
          mkdir ump-bootstrap
          (cd backend && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../ump-bootstrap/ump ./cmd/ump)
          printf 'FROM scratch\nCOPY ump /usr/local/bin/ump\n' > ump-bootstrap/Dockerfile
          docker build -t umpteenth-bootstrap:test ump-bootstrap
          kind load docker-image ghcr.io/stonith404/umpteenth-sandbox:latest umpteenth-bootstrap:test --name umpteenth
          kind get kubeconfig --name umpteenth > "$RUNNER_TEMP/kubeconfig"
          {
            echo "SANDBOXTEST_KUBERNETES=1"
            echo "SANDBOXTEST_KUBECONFIG=$RUNNER_TEMP/kubeconfig"
            echo "SANDBOXTEST_BROKER_HOST=$KIND_GATEWAY"
            echo "SANDBOXTEST_BOOTSTRAP_IMAGE=umpteenth-bootstrap:test"
            echo "SANDBOXTEST_REGISTRY=$KIND_REGISTRY_ADDR/sandboxtest"
            echo "SANDBOXTEST_REGISTRY_INSECURE=true"
          } >> "$GITHUB_ENV"
      - name: Conformance suite
        working-directory: backend
        run: go test -tags exclude_frontend,exclude_ump,integration -count=1 -timeout 25m ${{ matrix.engine == 'kubernetes' && './internal/sandbox/kubernetes/...' || './internal/sandbox/...' }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The matcher turns svelte-check findings into annotations on the changed lines
      # It expects the uncolored human output, since CI would otherwise get the machine format with paths relative to frontend/
      - run: echo "::add-matcher::.github/svelte-check-matcher.json"
      - run: pnpm check --output human --no-color
      - run: echo "::remove-matcher owner=svelte-check::"
      - run: pnpm lint
      - run: pnpm build
      # The docs build runs the backend to generate the API reference
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: pnpm docs:build

  e2e:
    name: E2E (${{ matrix.topology }})
    runs-on: ubuntu-latest
    needs: [changes, backend, frontend]
    if: needs.changes.outputs.app == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        topology: [single, ha, kubernetes]
    env:
      # Docker Compose reads the stack file from here, so every compose command below targets the matrix topology
      COMPOSE_FILE: ${{ matrix.topology == 'ha' && 'docker-compose-ha.yml' || 'docker-compose.yml' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter umpteenth-tests

      # The browser download is cached per lockfile, while its system packages are installed on every run
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter umpteenth-tests exec playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter umpteenth-tests exec playwright install-deps chromium

      - name: Build the sandbox image
        run: docker build -t ghcr.io/stonith404/umpteenth-sandbox:latest docker/sandbox
      - name: Start the stack
        if: matrix.topology != 'kubernetes'
        working-directory: tests/setup
        run: docker compose up -d --build --wait
      # The Helm chart runs on kind with its defaults: two replicas, the bundled Postgres and sandboxes as pods
      # Webhook receivers listen on the runner, which the server pods reach as host.docker.internal through kind's gateway
      # The registry sits on a private address, which build pods reach only through an extra rule
      - name: Install the Helm chart on kind
        if: matrix.topology == 'kubernetes'
        run: |
          eval "$(tests/setup/kind.sh)"
          docker build -f docker/Dockerfile --build-arg BUILD_TAGS=e2etest -t umpteenth:test .
          kind load docker-image umpteenth:test ghcr.io/stonith404/umpteenth-sandbox:latest --name umpteenth
          kind get kubeconfig --name umpteenth > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          helm install umpteenth charts/umpteenth --namespace umpteenth --create-namespace --wait --timeout 5m \
            -f tests/setup/values-kind.yaml \
            --set sandbox.registry.repository="$KIND_REGISTRY_ADDR/jobs" \
            --set "networkPolicy.build.extraEgress[0].to[0].ipBlock.cidr=${KIND_REGISTRY_ADDR%:*}/32" \
            --set "hostAliases[0].ip=$KIND_GATEWAY" --set "hostAliases[0].hostnames[0]=host.docker.internal"
          timeout 60 sh -c 'until curl -sf http://localhost:8080/healthz; do sleep 1; done'
      - run: pnpm test

      # The stack logs go into the report artifact so failures can be debugged next to the traces
      - name: Collect stack logs
        if: failure() && matrix.topology != 'kubernetes'
        working-directory: tests/setup
        run: |
          mkdir -p ../.report
          docker compose logs --no-color --timestamps > ../.report/stack.log
      - name: Collect cluster logs
        if: failure() && matrix.topology == 'kubernetes'
        run: |
          mkdir -p tests/.report
          kubectl get pods --all-namespaces -o wide > tests/.report/pods.txt
          kubectl get events --all-namespaces --sort-by=.lastTimestamp > tests/.report/events.txt
          kubectl --namespace umpteenth logs --selector app.kubernetes.io/component=server --prefix --timestamps --tail=-1 > tests/.report/stack.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.topology }}
          path: tests/.report
          include-hidden-files: true
          retention-days: 15
