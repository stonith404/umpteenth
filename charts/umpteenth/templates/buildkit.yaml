{{- if include "umpteenth.buildkit" . }}
{{- $name := printf "%s-buildkit" (include "umpteenth.fullname" .) -}}
{{- $namespace := include "umpteenth.sandboxNamespace" . -}}
{{- $registryHost := regexReplaceAll "/.*" .Values.sandbox.registry.repository "" -}}
# The BuildKit daemon job image builds run on, which keeps the layers of earlier builds; build pods are only its clients
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "umpteenth.metaLabels" . | nindent 4 }}
data:
  # The image's own subordinate ID ranges lie outside the 65536 IDs of the pod's user namespace, so these cover the rest of them next to the user's ID 1000
  subids: |
    user:1:999
    user:1001:64535
  {{- if .Values.sandbox.registry.insecure }}
  buildkitd.toml: |
    [registry.{{ $registryHost | quote }}]
      http = true
      insecure = true
  {{- end }}
---
{{- if .Values.sandbox.buildkit.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "umpteenth.metaLabels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.sandbox.buildkit.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.sandbox.buildkit.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "umpteenth.metaLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: buildkit
  ports:
    - name: buildkit
      port: 1234
      targetPort: buildkit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    {{- include "umpteenth.metaLabels" . | nindent 4 }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: buildkit
spec:
  replicas: 1
  # The cache belongs to one daemon at a time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: buildkit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: buildkit
        umpteenth.dev/role: buildkit
      {{- with .Values.caCertificates.pem }}
      annotations:
        checksum/ca-certificates: {{ . | sha256sum }}
      {{- end }}
    spec:
      hostUsers: false
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.sandbox.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.sandbox.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: buildkitd
          image: {{ .Values.sandbox.buildkit.image }}
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --addr
            - unix:///run/user/1000/buildkit/buildkitd.sock
            - --oci-worker-no-process-sandbox=false
            {{- if .Values.sandbox.registry.insecure }}
            - --config
            - /etc/buildkit/buildkitd.toml
            {{- end }}
          {{- if include "umpteenth.caConfigMap" . }}
          # The daemon pulls and pushes itself, so it trusts the extra CA certificates next to its image's bundle
          env:
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs:/etc/umpteenth/ca
          {{- end }}
          ports:
            - name: buildkit
              containerPort: 1234
          # Rootless BuildKit creates user namespaces, which the runtime's default seccomp and AppArmor profiles forbid
          securityContext:
            procMount: Unmasked
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: Unconfined
            appArmorProfile:
              type: Unconfined
          readinessProbe:
            tcpSocket:
              port: buildkit
            periodSeconds: 5
          resources:
            {{- toYaml .Values.sandbox.buildkit.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /home/user/.local/share/buildkit
            - name: config
              mountPath: /etc/subuid
              subPath: subids
              readOnly: true
            - name: config
              mountPath: /etc/subgid
              subPath: subids
              readOnly: true
            {{- if .Values.sandbox.registry.insecure }}
            - name: config
              mountPath: /etc/buildkit
              readOnly: true
            {{- end }}
            {{- if include "umpteenth.caConfigMap" . }}
            - name: ca-certificates
              mountPath: /etc/umpteenth/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: cache
          {{- if .Values.sandbox.buildkit.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
          {{- else }}
          emptyDir:
            sizeLimit: 10Gi
          {{- end }}
        - name: config
          configMap:
            name: {{ $name }}
        {{- with (include "umpteenth.caConfigMap" .) }}
        - name: ca-certificates
          configMap:
            name: {{ . }}
            items:
              - key: {{ $.Values.caCertificates.key | quote }}
                path: ca.crt
        {{- end }}
{{- end }}
