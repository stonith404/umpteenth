{{- $name := include "umpteenth.fullname" . -}}
{{- $needsKey := not .Values.app.encryptionKey.existingSecret -}}
{{- $needsDatabase := and .Values.database.connectionString (not .Values.database.existingSecret) -}}
{{- $needsRegistry := and .Values.sandbox.registry.password (not .Values.sandbox.registry.existingSecret) -}}
{{- if or $needsKey $needsDatabase $needsRegistry }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "umpteenth.labels" . | nindent 4 }}
  annotations:
    # Losing the encryption key makes every stored secret unreadable, so uninstalling keeps it
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- if $needsKey }}
  encryption-key: {{ include "umpteenth.persistedSecret" (dict "namespace" .Release.Namespace "name" $name "key" "encryption-key") | quote }}
  {{- end }}
  {{- if $needsDatabase }}
  connection-string: {{ .Values.database.connectionString | quote }}
  {{- end }}
  {{- if $needsRegistry }}
  registry-password: {{ .Values.sandbox.registry.password | quote }}
  {{- end }}
{{- end }}
