# Umpteenth manages sandbox pods, their environment Secrets and the contexts of image builds in the sandbox namespace, and nothing else
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "umpteenth.fullname" . }}-sandboxes
  namespace: {{ include "umpteenth.sandboxNamespace" . }}
  labels:
    {{- include "umpteenth.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "umpteenth.fullname" . }}-sandboxes
  namespace: {{ include "umpteenth.sandboxNamespace" . }}
  labels:
    {{- include "umpteenth.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "umpteenth.fullname" . }}-sandboxes
subjects:
  - kind: ServiceAccount
    name: {{ include "umpteenth.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
