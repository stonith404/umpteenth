<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Umpteenth demo</title>
		<link rel="icon" href="../../static/favicon.svg" type="image/svg+xml" />
		<!-- The app's stylesheet paints long before its script has loaded and set the color mode, so the docs' theme is applied here, before the first paint -->
		<!-- mode-watcher then finds the same mode in storage and takes over -->
		<script>
			(() => {
				let theme = new URLSearchParams(location.search).get('theme');
				try {
					theme = window.parent.document.documentElement.dataset.theme ?? theme;
				} catch {}
				if (theme !== 'light' && theme !== 'dark') {
					theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.classList.toggle('dark', theme === 'dark');
				document.documentElement.style.colorScheme = theme;
				try {
					localStorage.setItem('mode-watcher-mode', theme);
				} catch {}
			})();
		</script>
		<script type="module" src="./main.ts"></script>
	</head>
	<body></body>
</html>
