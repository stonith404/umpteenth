<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>Umpteenth</title>
		<script>
			// Apply the stored color mode before the first paint, so dark mode users never see a light flash
			try {
				const mode = localStorage.getItem('mode-watcher-mode') || 'system';
				const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
				const isDark = mode === 'dark' || (mode === 'system' && prefersDark);

				document.documentElement.classList.toggle('dark', isDark);
				document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
			} catch {
				// Failing to restore the mode only costs a flash, mode-watcher still applies it after hydration
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
