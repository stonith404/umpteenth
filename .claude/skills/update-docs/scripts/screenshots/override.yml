services:
  umpteenth:
    image: umpteenth-docs:test
    ports: !override
      - '18086:8080'
    environment:
      APP_URL: http://localhost:18086
      # Runs use the sandbox image built from this checkout, which cap.mjs shows under its public name
      SANDBOX_IMAGE: umpteenth-docs-sandbox:test
volumes:
  umpteenth-test-data:
    name: umpteenth-docs-shots-data
