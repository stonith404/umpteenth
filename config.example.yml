# This file only contains the options you most likely change
# Visit https://umpteenth.dev/deployment/configuration to read about every option and its default

app:
  # Recommended to change
  # Public URL Umpteenth is opened at
  url: http://localhost:8080
  # Required
  # Encrypts secrets and API keys at rest and signs sessions, at least 16 bytes
  # Generate one with: openssl rand -base64 32
  encryption_key: ""

auth:
  passkeys:
    # Everyone signs in with a passkey. Set it to false to sign in only through the providers below
    enabled: true
  # Sign-in providers for your identity provider (generic OIDC) or GitHub, shown on the login page next to passkeys
  # Uncomment the ones you use and fill in their client
  # providers:
  #   pocket-id:
  #     type: oidc
  #     name: Pocket ID
  #     issuer: https://id.example.com
  #     client_id: umpteenth
  #     client_secret: ""
  #     allowed_groups: []
  #   github:
  #     type: github
  #     name: GitHub
  #     client_id: ""
  #     client_secret: ""
  #     # Required
  #     # These GitHub usernames may sign in, or list GitHub organizations under allowed_organizations instead
  #     allowed_users: [octocat]

server:
  # Recommended to change
  # Set it to true behind a reverse proxy
  trust_proxy: false
