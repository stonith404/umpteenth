# git-cliff configuration, used by .github/workflows/release.yml to pick the next version and write CHANGELOG.md
# https://git-cliff.org/docs/configuration

[remote.github]
owner = "stonith404"
repo = "umpteenth"

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = false
# Squash merges append "(#123)" to the subject, which the changelog already links from the PR metadata
commit_preprocessors = [{ pattern = '\s*\((\w+\s)?#([0-9]+)\)', replace = "" }]
# The HTML comments only order the groups and are stripped when rendering
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance Improvements" },
  { message = "^docs", group = "<!-- 3 -->Documentation" },
  { message = "^release", skip = true },
  { message = "^chore\\(deps", group = "<!-- 5 -->Dependencies" },
  { message = ".*", group = "<!-- 4 -->Other" },
]

[bump]
initial_tag = "v0.1.0"
no_increment_regex = "^(chore|ci|docs|refactor|style|test|build)"

[changelog]
trim = true
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim }} \
  {%- if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})\
  {%- else %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})\
  {%- endif %} by @{{ commit.remote.username | default(value=commit.author.name) }})
{%- endfor %}
{% endfor %}
{% if previous.version -%}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}

{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
"""
